<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Planner - Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<header>
    <div class="container">
        <div class="logo">
            <h1>Holiday Planner</h1>
        </div>
        <!-- currency selector removed from contact page -->
        <nav>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="bali.html">Bali 7 nights</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="menu-icon" id="menuIcon">
                <i class="fas fa-bars"></i>
            </div>
        </nav>
    </div>
</header>

<main>
    <section class="contact-form">
        <div class="container">
            <h2>Contact us</h2>
            <p>Fill the form and we'll reply within 24 hours.</p>
            <form id="contactForm">
                <label>Your name:</label>
                <input type="text" id="nameField" required>

                <label>Email:</label>
                <input type="email" id="emailField" required>

                <label>Message:</label>
                <textarea id="msgField" rows="5" required></textarea>

                <button type="submit" class="btn">Send message</button>
            </form>
            <div id="formMsg"></div>
        </div>
    </section>
</main>


<script src="js/script.js"></script>
</body>
</html>
